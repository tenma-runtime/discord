[package]
name = "tenma_discord"
version = "0.1.3"
edition = "2024"

[dependencies]
async-trait = "0.1"
futures-util = { version = "0.3", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
songbird = { version = "0.6.1", default-features = false, features = ["builtin-queue", "driver", "gateway", "twilight", "rustls", "tws"] }
symphonia = { version = "0.5", features = ["mp3", "aac", "isomp4"] }
tenma-plugin = { git = "https://github.com/tenma-runtime/tenma", version = "0.1.0" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
twilight-gateway = "0.17"
twilight-model = "0.17"

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true
codegen-units = 1
strip = true
